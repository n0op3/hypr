source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 2
    blur_size = 4
    brightness = 0.6
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 460, 70
    rounding = 8
    inner_color = rgba(27, 27, 27, 1)
    outer_color = $color1 $color4
    font_color = rgb(255, 255, 255)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    placeholder_text = <i>  </i>
    fade_on_empty = false
    check_text = <i>Validating...</i>
    fail_text = <b>Access denied</b>
    halign = center
    position = 0, -76
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1)
    font_size = 160
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 8
    position = 0, 156
    halign = center
}

label {
    monitor =
    text = cmd[] date '+%a, %b %d'
    color = rgba(200, 200, 200, 1)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 8
    position = 0, 28
    halign = center
}
